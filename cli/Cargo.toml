[package]
name = "mach-cli"
version = "0.1.24"
edition = "2021"
description = "Create and locally develop multiplayer browser games"
license = "MIT OR Apache-2.0"
repository = "https://github.com/machinesatplay/machinesatplay"

[[bin]]
name = "mach"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
fs2 = "0.4"
notify = "8.2"
game-format = { path = "../crates/game-format" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ureq = "2.12"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
toml = "0.9"
filetime = "0.2"
mimalloc = "0.1"
blake3 = { version = "1.8", features = ["rayon"] }
wasm-bindgen-cli-support = "=0.2.126"
wasm-encoder = { version = "=0.245.1", features = ["wasmparser"] }
wasmparser = "=0.245.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
