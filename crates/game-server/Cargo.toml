[package]
name = "game-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/machinesatplay/machinesatplay"

[[bin]]
name = "mach-server"
path = "src/main.rs"

[dependencies]
async-compat = "0.2"
avian3d = { version = "0.7", default-features = false, features = [
  "3d",
  "f32",
  "parry-f32",
  "enhanced-determinism",
] }
bevy = { version = "0.19", default-features = false, features = [
  "async_executor",
  "bevy_color",
  "bevy_log",
  "bevy_state",
  "multi_threaded",
  "std",
] }
clap = { version = "4.5", features = ["derive"] }
game-core = { path = "../game-core", default-features = false, features = ["server"] }
lightyear = { version = "0.28.0", default-features = false, features = [
  "avian3d",
  "std",
  "input_native",
  "netcode",
  "webtransport",
  "interpolation",
  "prediction",
  "replication",
  "server",
] }
